{% extends 'base.html' %}
{% block title %}Doctors{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">🩺 Find a Doctor</h2>
    <span class="text-muted small">Browse specialists and book appointments</span>
</div>

<div id="doctors" class="row g-3"></div>

<!-- ============ BOOK MODAL ============ -->
<div class="modal fade" id="bookModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4 border-0">
      <div class="modal-header">
        <h5 class="modal-title">
          Book appointment with <span id="modalDoctor" class="fw-bold"></span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="modalDoctorId">

        <h6 class="fw-bold mb-3">Available Slots</h6>
        <div id="slotList" class="row g-2"></div>

        <p id="bookMsg" class="small mt-3 mb-0"></p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const token = localStorage.getItem('access');
const role = localStorage.getItem('role');

async function loadDoctors() {
    const res = await fetch('/api/doctors/');
    const data = await res.json();
    const container = document.getElementById('doctors');

    if (data.data.length === 0) {
        container.innerHTML =
            '<p class="text-muted">No doctors registered yet.</p>';
        return;
    }

    container.innerHTML = data.data.map(doc => `
        <div class="col-md-4">
            <div class="card shadow-sm border-0 rounded-4 h-100">
                <div class="card-body">
                    <h5 class="fw-bold mb-1">Dr. ${doc.username}</h5>
                    <p class="text-primary mb-2 small">${doc.specialization}</p>
                    <p class="small mb-1">🎓 ${doc.experience_years} years experience</p>
                    <p class="small mb-1">💰 ₹${doc.consultation_fee} per visit</p>
                    <p class="small text-muted">${doc.bio || 'No bio available.'}</p>
                    <hr>
                    <button onclick="openBookModal(${doc.id}, '${doc.username}')"
                            class="btn btn-sm btn-primary w-100">View Slots & Book</button>
                </div>
            </div>
        </div>
    `).join('');
}

async function openBookModal(doctorId, doctorName) {
    if (!token) { window.location.href = '/login/'; return; }
    if (role !== 'patient') { alert('Only patients can book appointments.'); return; }

    document.getElementById('modalDoctorId').value = doctorId;
    document.getElementById('modalDoctor').innerText = 'Dr. ' + doctorName;
    document.getElementById('bookMsg').innerHTML = '';
    document.getElementById('slotList').innerHTML =
        '<p class="text-muted small">Loading slots...</p>';

    new bootstrap.Modal(document.getElementById('bookModal')).show();

    const res = await fetch('/api/slots/?doctor=' + doctorId);
    const data = await res.json();
    const container = document.getElementById('slotList');

    if (data.data.length === 0) {
        container.innerHTML =
            '<p class="text-muted small">No available slots. Please check back later.</p>';
        return;
    }

    container.innerHTML = data.data.map(slot => `
        <div class="col-md-6">
            <div class="border rounded-3 p-3 d-flex justify-content-between align-items-center">
                <div>
                    <strong>${slot.date}</strong><br>
                    <small class="text-muted">${slot.start_time} – ${slot.end_time}</small>
                </div>
                <button onclick="bookSlot(${slot.id})" class="btn btn-sm btn-success">Book</button>
            </div>
        </div>
    `).join('');
}

async function bookSlot(slotId) {
    const res = await fetch('/api/appointments/book/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
        },
        body: JSON.stringify({ slot: slotId })
    });
    const data = await res.json();
    const msg = document.getElementById('bookMsg');

    if (res.ok) {
        msg.innerHTML = '<span class="text-success">Appointment booked successfully!</span>';
        // Reload slots list
        const doctorId = document.getElementById('modalDoctorId').value;
        openBookModal(doctorId, document.getElementById('modalDoctor').innerText.replace('Dr. ', ''));
    } else {
        msg.innerHTML = '<span class="text-danger">' + data.message + '</span>';
    }
}

loadDoctors();
</script>
{% endblock %}
