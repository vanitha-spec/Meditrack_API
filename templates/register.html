{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4">
                <h3 class="mb-3 text-center">Create Account ✨</h3>
                <p class="text-muted text-center small">Join as a doctor or patient</p>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input id="username" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input id="email" type="email" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input id="password" type="password" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">I am a</label>
                    <select id="role" class="form-select">
                        <option value="patient">Patient</option>
                        <option value="doctor">Doctor</option>
                    </select>
                </div>
                <button onclick="register()" class="btn btn-warning w-100">Register</button>

                <p id="msg" class="text-center mt-3 small"></p>

                <p class="text-center small mt-2">
                    Have an account? <a href="/login/">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
async function register() {
    const res = await fetch('/api/register/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value,
        })
    });
    const data = await res.json();
    const msg = document.getElementById('msg');

    if (res.ok) {
        msg.innerHTML = '<span class="text-success">Registered! Redirecting to login...</span>';
        setTimeout(() => window.location.href = '/login/', 1000);
    } else {
        let errMsg = data.message || 'Registration failed';
        if (data.errors) {
            const k = Object.keys(data.errors)[0];
            if (k) errMsg = `${k}: ${data.errors[k][0]}`;
        }
        msg.innerHTML = '<span class="text-danger">' + errMsg + '</span>';
    }
}
</script>
{% endblock %}
