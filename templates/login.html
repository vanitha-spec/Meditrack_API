{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4">
                <h3 class="mb-3 text-center">Welcome to MediTrack 🏥</h3>
                <p class="text-muted text-center small">Log in to continue</p>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input id="username" class="form-control" placeholder="Enter username">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input id="password" type="password" class="form-control" placeholder="Enter password">
                </div>
                <button onclick="login()" class="btn btn-primary w-100">Login</button>

                <p id="msg" class="text-center mt-3 small"></p>

                <p class="text-center small mt-2">
                    No account? <a href="/register/">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
async function login() {
    const res = await fetch('/api/login/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
        })
    });
    const data = await res.json();
    const msg = document.getElementById('msg');

    if (res.ok) {
        localStorage.setItem('access', data.data.tokens.access);
        localStorage.setItem('role', data.data.user.role);
        localStorage.setItem('username', data.data.user.username);
        msg.innerHTML = '<span class="text-success">Login successful! Redirecting...</span>';
        setTimeout(() => window.location.href = '/doctors/', 800);
    } else {
        msg.innerHTML = '<span class="text-danger">' + (data.message || 'Login failed') + '</span>';
    }
}
</script>
{% endblock %}
