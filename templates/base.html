<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}MediTrack{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/doctors/">🏥 MediTrack</a>
        <div class="ms-auto d-flex align-items-center">
            <a href="/doctors/" class="btn btn-sm btn-outline-light me-2">Doctors</a>

            <span id="navPatient" style="display:none;">
                <a href="/my-appointments/" class="btn btn-sm btn-outline-light me-2">My Appointments</a>
            </span>

            <span id="navDoctor" style="display:none;">
                <a href="/doctor/" class="btn btn-sm btn-outline-light me-2">Dashboard</a>
            </span>

            <span id="navGuest">
                <a href="/login/" class="btn btn-sm btn-outline-light me-2">Login</a>
                <a href="/register/" class="btn btn-sm btn-warning">Register</a>
            </span>

            <span id="navUser" style="display:none;">
                <span class="text-light small me-2" id="navUsername"></span>
                <button onclick="logout()" class="btn btn-sm btn-outline-light">Logout</button>
            </span>
        </div>
    </div>
</nav>

<div class="container py-5">
    {% block content %}{% endblock %}
</div>

<footer class="text-center text-muted py-4 small">
    © 2026 MediTrack — Built with Django & Bootstrap
</footer>

<script>
const _token = localStorage.getItem('access');
const _role = localStorage.getItem('role');
const _username = localStorage.getItem('username');

if (_token) {
    document.getElementById('navGuest').style.display = 'none';
    document.getElementById('navUser').style.display = 'inline';
    document.getElementById('navUsername').innerText = _username;

    if (_role === 'doctor') {
        document.getElementById('navDoctor').style.display = 'inline';
    } else if (_role === 'patient') {
        document.getElementById('navPatient').style.display = 'inline';
    }
}

function logout() {
    localStorage.clear();
    window.location.href = '/login/';
}
</script>

</body>
</html>
